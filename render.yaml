services:
  - type: web
    name: house-price-predictor
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn house_price_system.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
